# The gate: what the agent may touch and how much (Bible D16, D17). Plain data, enforced by plain code.
allowed_domains:
  - pib.gov.in
  - mausam.imd.gov.in
  - api.data.gov.in
  - factchecktools.googleapis.com
  - www.wikidata.org
  - web.archive.org
read_only: true
budgets:
  max_steps_per_claim: 12
  max_seconds_per_claim: 45
  max_fetches_per_claim: 8
  reverse_search_per_day: 0    # paid reverse search is out (team decision); provenance uses our own pHash/PDQ index
gemini:
  api_base: https://generativelanguage.googleapis.com/v1beta
  models: [gemini-3.5-flash-lite, gemini-3.8-flash]    # first is the working default (spikes.md, 2026-10-31)
  measure_max_calls: 40       # hard cap on live calls per measurement run, to stay inside the free tier
  measure_timeout_s: 60
  retest_attempts: 3
  request_timeout_s: 30
  max_retries: 2
  max_retry_wait_s: 30
  requests_per_minute: 15     # free tier, from the API's own 429 body (docs/gemini_limits.md)
  measured_on: "2026-10-30"

