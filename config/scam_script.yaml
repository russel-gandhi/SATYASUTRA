# Scam Guard script rules (package SG1): plain word groups, no model. A scam call is a script: an authority, a threat, urgency, secrecy and a request for money, a code or remote access.
# Phrases are matched as whole words or phrases after lower-casing, English, Hindi and romanised Hindi (Hinglish).
# The Hindi and Hinglish phrases are OUR drafts and have NOT been reviewed by a native speaker (SG7): reviewed_by stays empty until someone does.
# The numbers (window, minimum signals) are policy choices tuned on the small dev part of tests/guard/set.jsonl only, not calibrated on real calls.
reviewed_by: ""
reviewed_on: ""
settings:
  window_chunks: 6            # a signal heard in the last N chunks still counts
  min_signals_amber: 2        # this many different signals in the window make "be careful"
  session_s: 900              # a call session is forgotten after this many seconds without a chunk (memory only)
  max_sessions: 200
  max_chunk_bytes: 2000000
  max_text_chars: 2000
  tail_chars: 160             # how much of the latest words is sent back for the screen
signals:
  authority:
    - police
    - cbi
    - customs
    - "cyber cell"
    - "cyber crime"
    - court
    - "narcotics"
    - "enforcement directorate"
    - "bank officer"
    - "rbi"
    - "trai"
    - "पुलिस"
    - "सीबीआई"
    - "कस्टम"
    - "साइबर सेल"
    - "कोर्ट"
    - "पुलिस वाला"
    - "police station"
    - "inspector"
  threat:
    - arrest
    - arrested
    - "case registered"
    - "case has been registered"
    - "account will be blocked"
    - "account blocked"
    - "sim will be blocked"
    - "sim disconnected"
    - "legal action"
    - "case is registered"
    - "power will be cut"
    - "connection will be disconnected"
    - "will be disconnected"
    - "connection kat jayega"
    - "bijli kat jayegi"
    - "warrant"
    - "गिरफ्तार"
    - "गिरफ़्तार"
    - "केस दर्ज"
    - "खाता बंद"
    - "वारंट"
    - "arrest ho jaoge"
    - "arrest ho jayega"
    - "case ho gaya"
    - "account band"
    - "warrant nikla"
  urgency:
    - "right now"
    - "immediately"
    - "within an hour"
    - "within 30 minutes"
    - "tonight"
    - "do not disconnect"
    - "don't disconnect"
    - "stay on the line"
    - "last warning"
    - "अभी"
    - "तुरंत"
    - "फ़ोन मत काटिए"
    - "फोन मत काटिए"
    - "abhi"
    - "turant"
    - "phone mat katna"
    - "line par bane rahiye"
  secrecy:
    - "do not tell anyone"
    - "don't tell anyone"
    - "do not tell your family"
    - "do not call your family"
    - "keep this secret"
    - "किसी को मत बताना"
    - "किसी को न बताएं"
    - "घर वालों को मत बताना"
    - "kisi ko mat batana"
    - "kisi ko nahi batana"
    - "ghar walon ko mat batana"
  credential_request:
    - otp
    - "o t p"
    - pin
    - cvv
    - "card number"
    - "upi pin"
    - "password"
    - "ओटीपी"
    - "पिन"
    - "सीवीवी"
    - "कार्ड नंबर"
    - "otp batao"
    - "otp bataiye"
    - "pin batao"
    - "card number batao"
  money_request:
    - "safe account"
    - "transfer the money"
    - "transfer money"
    - "send money"
    - "pay the fine"
    - "verification deposit"
    - "gift card"
    - "security deposit"
    - "सेफ अकाउंट"
    - "पैसे ट्रांसफर"
    - "पैसे भेजिए"
    - "जुर्माना भरिए"
    - "paise bhejo"
    - "paise transfer karo"
    - "paise bhejiye"
    - "fine bharo"
  remote_access:
    - anydesk
    - teamviewer
    - "quicksupport"
    - "install an app"
    - "install the app"
    - "share your screen"
    - "screen share"
    - "एनीडेस्क"
    - "स्क्रीन शेयर"
    - "app install karo"
    - "screen share karo"
  personal_crisis:
    - "your son is"
    - "your daughter is"
    - "in custody"
    - "had an accident"
    - "in the hospital"
    - "आपका बेटा"
    - "आपकी बेटी"
    - "हिरासत में"
    - "एक्सीडेंट"
    - "aapka beta"
    - "aapki beti"
    - "hirasat mein"
    - "accident ho gaya"
# A sentence with one of these cancels the signals listed in negation_cancels for that sentence only: a real bank saying "never share your OTP" must not alert.
negations:
  - "do not share"
  - "don't share"
  - "never share"
  - "never ask"
  - "will never ask"
  - "does not ask"
  - "do not give"
  - "don't give"
  - "should not share"
  - "beware of"
  - "कभी नहीं माँगता"
  - "कभी नहीं मांगता"
  - "साझा न करें"
  - "शेयर न करें"
  - "न बताएं"
  - "kabhi share na karein"
  - "kabhi nahi mangta"
  - "share na karein"
  - "kisi ko na batayein"
negation_cancels: [credential_request, money_request, remote_access]
# Red ("this looks like a scam"): any of these signal sets all present in the window. Amber ("be careful"): the minimum number of different signals, or any single signal here.
red_when:
  - [credential_request]
  - [remote_access]
  - [money_request, threat]
  - [money_request, authority]
  - [personal_crisis, money_request]
  - [authority, threat]
amber_on: [secrecy, money_request]
# The scam type shown with a red alert: the first entry whose signals are all present.
types:
  digital_arrest: [authority, threat]
  family_emergency: [personal_crisis, money_request]
  bank_or_code_request: [credential_request]
  remote_access_scam: [remote_access]
  payment_demand: [money_request]
states:
  listening: {en: "Listening. Nothing alarming heard so far.", hi: "सुन रहा हूँ। अब तक कुछ चिंताजनक नहीं सुना।"}
  careful: {en: "Be careful. Some things said on this call are common in scams.", hi: "सावधान रहिए। इस कॉल की कुछ बातें ठगी में आम हैं।"}
  scam: {en: "This looks like a scam. Hang up. Do not share any code or send money.", hi: "यह ठगी लगती है। फ़ोन काट दीजिए। कोई कोड न बताएं, पैसे न भेजें।"}
# One plain line per scam type, shown under a red alert. Hindi lines are OUR drafts, not reviewed by a native speaker (SG7).
advice:
  digital_arrest: {en: "No police or court arrests anyone over a phone or video call, and none takes money to clear a case. Hang up and call 112 or go to your local police station yourself.", hi: "कोई पुलिस या अदालत फ़ोन या वीडियो कॉल पर गिरफ़्तारी नहीं करती और न केस निपटाने के लिए पैसे माँगती है। फ़ोन काटिए और 112 पर कॉल कीजिए या खुद थाने जाइए।"}
  family_emergency: {en: "Hang up and call your relative on the number you already have. Do not send money until you have spoken to them.", hi: "फ़ोन काटिए और अपने रिश्तेदार को उनके पुराने नंबर पर खुद कॉल कीजिए। उनसे बात होने तक पैसे न भेजें।"}
  bank_or_code_request: {en: "A bank never asks for your OTP, PIN or card number on a call. Hang up and call the number on the back of your card.", hi: "बैंक कॉल पर कभी ओटीपी, पिन या कार्ड नंबर नहीं माँगता। फ़ोन काटिए और कार्ड के पीछे छपे नंबर पर कॉल कीजिए।"}
  remote_access_scam: {en: "Do not install any app or share your screen for someone who called you. Hang up. If you already did, turn off the internet and call your bank.", hi: "फ़ोन करने वाले के कहने पर कोई ऐप इंस्टॉल न करें, स्क्रीन शेयर न करें। फ़ोन काटिए। कर चुके हों तो इंटरनेट बंद करके बैंक को कॉल कीजिए।"}
  payment_demand: {en: "Do not pay anyone who calls demanding money in a hurry. Check the bill on the official app or site yourself.", hi: "जल्दी में पैसे माँगने वाले फ़ोन पर किसी को भुगतान न करें। बिल खुद आधिकारिक ऐप या साइट पर देखिए।"}
# Text the person can send to someone they trust with one tap (they choose the app and the contact; we never see a number and send nothing). Hindi is our draft, unreviewed (SG7).
family_alert: {en: "I may be getting a scam call right now. Please call me on my usual number. I am not sending any money or codes.", hi: "शायद मुझे अभी ठगी का कॉल आ रहा है। कृपया मुझे मेरे पुराने नंबर पर कॉल करें। मैं कोई पैसे या कोड नहीं भेज रहा/रही।"}
