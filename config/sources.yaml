# Every live source the system may touch. Candidates only: status stays "unverified" until
# scripts/probe_sources.py has reached it from this machine (Bible Q3). URLs here were not
# confirmed by the author; the probe is what decides. Keys go in environment variables (auth_env).
sources:
  - id: bluesky_public_api
    role: public feed
    description: Bluesky public AppView (profile lookups work without auth)
    probe_url: https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=bsky.app
    tier: 4
    rate_limit_per_min: 60
    cache_ttl_s: 60
    note: probed 2026-10-31 - describeServer returns 501 and feed.searchPosts returns 403 here, so ingestion cannot rely on AppView search; use Jetstream

  - id: bluesky_jetstream
    role: public feed
    description: Bluesky Jetstream host (HTTP reachability only; the websocket stream is a separate Phase 1 spike)
    probe_url: https://jetstream2.us-east.bsky.network/
    tier: 4
    cache_ttl_s: 0

  - id: rbi_press
    role: official, press releases
    description: Reserve Bank of India press-release RSS (full text in the feed)
    probe_url: https://www.rbi.org.in/pressreleases_rss.xml
    tier: 1
    rate_limit_per_min: 6
    cache_ttl_s: 900
    note: probed 2026-10-31, 200 with our descriptive User-Agent; replaces PIB as the official-text source

  - id: sebi_feed
    role: official, circulars and press releases
    description: SEBI RSS (titles only)
    probe_url: https://www.sebi.gov.in/sebirss.xml
    tier: 1
    rate_limit_per_min: 6
    cache_ttl_s: 900

  - id: pib
    role: official
    description: Press Information Bureau, Government of India
    probe_url: https://pib.gov.in/
    tier: 1
    note: probed 2026-10-31, HTTP 403 for robots.txt and every page with our descriptive User-Agent (a bot wall); we do not disguise the client, so PIB is not used. Same for mohfw.gov.in, pmindia.gov.in, cybercrime.gov.in
    rate_limit_per_min: 30
    cache_ttl_s: 900

  - id: imd
    role: official, weather
    description: India Meteorological Department
    probe_url: https://mausam.imd.gov.in/
    tier: 1
    rate_limit_per_min: 30
    cache_ttl_s: 900

  - id: data_gov_in
    role: official, open data
    description: Open Government Data platform, India
    probe_url: https://api.data.gov.in/
    tier: 1
    auth_env: DATA_GOV_IN_API_KEY
    auth_param: api-key
    rate_limit_per_min: 30
    cache_ttl_s: 3600

  - id: factcheck_tools
    role: fact-checks
    description: Google Fact Check Tools API (ClaimReview)
    probe_url: https://factchecktools.googleapis.com/v1alpha1/claims:search?query=election&pageSize=1
    tier: 2
    auth_env: GOOGLE_FACTCHECK_API_KEY
    auth_param: key
    rate_limit_per_min: 60
    cache_ttl_s: 600

  - id: wikidata
    role: knowledge graph
    description: Wikidata API; statements count as Tier 2 only when referenced (Bible I18)
    probe_url: https://www.wikidata.org/w/api.php?action=query&meta=siteinfo&format=json
    tier: 4
    rate_limit_per_min: 30
    cache_ttl_s: 3600
    note: probed 2026-10-31 - 403 "Wikimedia Error" with a generic User-Agent; Wikimedia expects a descriptive User-Agent with real team contact details (ticket F0-09)

  - id: wayback_cdx
    role: link archive
    description: Internet Archive CDX index, for when a link first existed
    probe_url: https://web.archive.org/cdx/search/cdx?url=example.com&limit=1
    tier: 4
    rate_limit_per_min: 15
    cache_ttl_s: 86400

  - id: telegram_bot_api
    role: bot channel
    description: Telegram Bot API host (reachability only; the token is never part of the probe URL)
    probe_url: https://api.telegram.org/
    tier: 4
    auth_env: TELEGRAM_BOT_TOKEN

  - id: gemini_llm
    role: llm
    description: Google Gemini API (LLM provider chosen by the team; model id is set in config once confirmed by a listing)
    probe_url: https://generativelanguage.googleapis.com/v1beta/models?pageSize=1
    tier: 4
    auth_env: GEMINI_API_KEY
    auth_param: key
    rate_limit_per_min: 10
    note: key held by the team; free-tier limits not verified

  # F1-10: fact-checker feeds, publishers taken from real Fact Check API results (F1-07 calibration queries, 2026-10-31).
  # Full Fact and Science Feedback were reachable but their feeds carry no images, so they are not used for the image index.
  - id: feed_altnews
    role: fact-check feed
    description: Alt News (English) RSS
    probe_url: https://www.altnews.in/feed/
    tier: 2
    rate_limit_per_min: 6
    cache_ttl_s: 900

  - id: feed_factly
    role: fact-check feed
    description: Factly (English) RSS
    probe_url: https://factly.in/feed/
    tier: 2
    rate_limit_per_min: 6
    cache_ttl_s: 900

  - id: feed_boom_hindi
    role: fact-check feed
    description: BOOM Hindi RSS
    probe_url: https://hindi.boomlive.in/feed
    tier: 2
    rate_limit_per_min: 6
    cache_ttl_s: 900

  - id: feed_boom_english
    role: fact-check feed
    description: BOOM English RSS
    probe_url: https://www.boomlive.in/feed
    tier: 2
    rate_limit_per_min: 6
    cache_ttl_s: 900

  - id: feed_factcheck_org
    role: fact-check feed
    description: FactCheck.org (English, US) RSS
    probe_url: https://www.factcheck.org/feed/
    tier: 2
    rate_limit_per_min: 6
    cache_ttl_s: 900

  - id: wikimedia_commons
    role: image provenance
    description: Wikimedia Commons API, for images with a documented history and for measuring false matches
    probe_url: https://commons.wikimedia.org/w/api.php?action=query&meta=siteinfo&format=json
    tier: 4
    rate_limit_per_min: 30
    cache_ttl_s: 3600
