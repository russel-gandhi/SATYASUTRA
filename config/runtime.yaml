ledger_db_path: data/ledger.sqlite3
cache_db_path: data/cache.sqlite3
probe:
  timeout_s: 8
  user_agent: "FORGE-probe/0.0.1 (hackathon build; contact: {contact})"
ingest:
  source_id: bluesky_jetstream
  ws_url: wss://jetstream2.us-east.bsky.network/subscribe
  collections: [app.bsky.feed.post]
  post_url_template: https://bsky.app/profile/{did}/post/{rkey}
  langs: [en, hi]              # posts with no language tag are skipped while this is set
  keywords: []
  min_text_chars: 40           # shorter posts rarely hold a checkable claim; revisit with the F1-08 capture
  skip_replies: true
  open_timeout_s: 15
  idle_timeout_s: 30
  reconnect_delay_s: 1
  max_reconnect_delay_s: 30
  resume_overlap_s: 2          # reconnect this far behind the last event; repeats are dropped by id
  recent_ids_kept: 20000
factcheck:
  endpoint: https://factchecktools.googleapis.com/v1alpha1/claims:search
  page_size: 5
  timeout_s: 20
fastclock:
  shingle_words: 3
  num_perm: 128
  lsh_bands: 32                # 4 rows per band; the similarity this bucketing starts to catch is about (1/bands)^(1/rows)
  window_s: 300
  cluster_idle_s: 900
  max_clusters: 5000
  result_ttl_s: 3600
  top_n: 10
  worker_enabled: false
  queue_max: 2000
  latency_samples: 2000
  repeat_keys_kept: 20000
  example_text_chars: 200
  members_kept: 400
  member_text_chars: 300
  trace_buckets: 12
  variants_shown: 8
  match_min_posts: 2
extract:
  max_claims_per_post: 5
  promote_kinds: [question, other]           # plus a factual claim the model called not worth checking
  promote_terms: [dead, died, dies, death, "passed away", killed, murdered, assassinated, shot, arrested, jailed, resigned, injured, hospitalised, hospitalized,
                  "critical condition", missing, banned, "shut down",
                  "मर गया", "मर गए", "मर गई", "मृत्यु", "निधन", "मृत", "हत्या", "गिरफ्तार", "इस्तीफा", "इस्तीफ़ा"]

verify:
  posts_endpoint: https://public.api.bsky.app/xrpc/app.bsky.feed.getPosts
  timeout_s: 15
  max_text_chars: 3000
  text_source_id: api_text
  uri_prefix: "at://"
  ledger_kind: verdict
  # Starting values, not measured: there is no data yet on how fast fact-checks appear or change. Revisit with real repeat traffic.
  # The Fact Check lookup keeps its own cache (sources.yaml, 600 s), so a verdict can be up to the TTL plus that old.
  cache_ttl_decided_s: 21600
  cache_ttl_undecided_s: 900
  judge_max_reviews: 10        # one Gemini call per claim covers up to this many reviews

provenance:
  db_path: data/provenance.sqlite3
  feeds:
    - {source_id: feed_altnews, publisher: Alt News, lang: en}
    - {source_id: feed_factly, publisher: Factly, lang: en}
    - {source_id: feed_boom_hindi, publisher: BOOM Hindi, lang: hi}
    - {source_id: feed_boom_english, publisher: BOOM, lang: en}
    - {source_id: feed_factcheck_org, publisher: FactCheck.org, lang: en}
  max_image_bytes: 8000000
  min_side_px: 200
  max_images_per_item: 6
  download_timeout_s: 20
  match_limit: 5
  image_requests_per_minute: 60
  commons:
    endpoint: https://commons.wikimedia.org/w/api.php
    thumb_width: 640
    sample_size: 60

trace:
  summary_max_chars: 200

escalation:
  enabled: false
  reserve_per_minute: 5        # of policy.gemini.requests_per_minute; the rest is the escalation budget
  tick_s: 5
  retry_after_s: 300
  max_audits_kept: 1000

forensics:
  url: http://127.0.0.1:8100
  timeout_s: 120
  max_upload_bytes: 15000000
  threshold: trufor_manipulation_score
  ai_threshold: smaug_ai_generated_score
  video_frames: 8
  video_ai_min_frames: 3
  max_video_bytes: 60000000
  max_video_s: 120
  ffmpeg_timeout_s: 30
  thumb_width: 240

knowledge_graph:
  endpoint: https://www.wikidata.org/w/api.php
  entity_url_template: https://www.wikidata.org/wiki/{id}
  language: en
  timeout_s: 15
  max_entities: 5
  name_max_chars: 80
  death_property: P570
  death_terms: [dead, died, death, dies, "passed away", "passes away", "no more", killed, assassinated, murdered, demise, deceased, "last breath", "rip",
                मृत, मर, मौत, निधन, देहांत, "नहीं रहे", हत्या]

official:
  db_path: data/official.sqlite3
  timeout_s: 20
  refresh_s: 900
  max_items_per_feed: 30
  max_passage_chars: 1500
  max_results: 5
  min_token_chars: 3
  contrast_rel_tol: 0.0001
  feeds:
    - id: rbi_press
      publisher: Reserve Bank of India
      url: https://www.rbi.org.in/pressreleases_rss.xml
      tier: 1
    - id: sebi_feed
      publisher: Securities and Exchange Board of India
      url: https://www.sebi.gov.in/sebirss.xml
      tier: 1

voice:
  service_url: http://127.0.0.1:8100
  service_timeout_s: 120
  model_dir: models/whisper-small
  device: cpu
  compute_type: int8
  beam_size: 5
  vad_filter: true
  max_bytes: 10000000
  max_seconds: 120
  decode_timeout_s: 30
  low_language_prob: 0.6

telegram:
  api_base: https://api.telegram.org
  local_api: http://127.0.0.1:8000
  token_env: TELEGRAM_BOT_TOKEN
  poll_timeout_s: 30
  request_margin_s: 10
  local_timeout_s: 120
  retry_s: 5
  max_reply_chars: 3800            # Telegram refuses messages over 4096
  private_header: x-private
  help_mode_s: 3600
  labels:                          # one sentence per verdict, spoken plainly; {publisher} and {rating} come from the first source
    REFUTED: "This is false. {publisher} checked this very claim and rated it \"{rating}\"."
    SUPPORTED: "This checks out. {publisher} looked at this claim and rated it \"{rating}\"."
    MISSING_CONTEXT: "This is misleading as it stands. {publisher} says important context is missing."
    UNVERIFIABLE_YET: "I can't confirm this one. No fact-checker I can search has looked at this claim yet."
    NOT_A_CLAIM: "That's an opinion, not something I can check."
    EDITED: "This image looks edited. The forensic check found signs that part of it was changed after it was taken."
    SYNTHETIC_SUSPECTED: "This image may be AI-generated. One detector flagged it, so treat that as a suspicion, not proof."
    OUT_OF_CONTEXT: "This image is real but used out of context."
    INCONCLUSIVE: "I can't tell. I found no sign of editing or AI generation, but that doesn't make the photo real: these checks miss a lot."
  messages:
    start: "Send me a claim, a forwarded message, a voice note or a photo and I'll check it. If nobody reliable has checked it, I'll say so instead of guessing. I never report or forward anything for you."
    none_found: "I didn't find a claim I can check in that. Opinions and chatter aren't claims."
    none_found_read: "I read your message as {kind}: \"{quote}\". I can only check statements of fact. If you meant to ask whether something happened, send it as a statement, for example \"<name> has died\", and I will check it."
    could_not_read: "I couldn't read that reliably, so I checked nothing and guessed nothing. Please send it again, or write it as a plain statement."
    kind_opinion: "an opinion"
    kind_question: "a question"
    kind_personal_experience: "something about you"
    kind_other: "a remark"
    kind_not_checkworthy: "a small detail not worth checking"
    source_line: "Read it here: {url}"
    more_line: "{n} other review(s) say the same."
    conflict: "Fact-checkers disagree on this one, so I won't call it either way."
    news_reported: "It is being talked about in the news: {publisher} ran \"{title}\" ({url}). That means it's in the news, not that it's true."
    news_not_found: "I also went through the latest stories from {n} major news outlets ({names}) and none of them is reporting this. That doesn't prove it's false, since I only see recent stories from the big outlets, but if it were a major event you'd expect to find it there. Don't forward it until a source you trust confirms it."
    media_match: "This image has appeared in a fact-check before: {url}"
    next_steps: "What you can do:"
    act_notice: "I don't report anything for you. Check these details on the official sites before you rely on them."
    transcript: "You said ({language}): {text}"
    uncertain: "I wasn't sure about the language, so some words may be wrong."
    voice_failed: "I couldn't read that voice note: {reason}"
    image_failed: "I couldn't read that image."
    unsupported: "I can check text, voice notes and photos."
    help_intro: "I'm sorry this is happening. It is not your fault, and you do not have to deal with it alone. I will not check this message or keep it. Here is what you can do:"
    help_no_images: "Please do not send me any photo, video or file about this. I will not open, keep or check them. Use the official services above: they are made for this. Send /forget to leave this mode and clear it."
    help_images_refused: "I am in help mode, so I did not download that file and did not look at it. Please do not send private images to anyone but the official services above. Send /forget to leave help mode."
    forgot: "Done. I am out of help mode and I keep nothing from this chat. Telegram itself still keeps the chat on its servers: you can delete it from your side."
    error: "Something went wrong while checking that. Nothing was recorded, please try again."

explain:
  max_players: 8
  words_shown: 12

