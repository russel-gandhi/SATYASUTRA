web:
  # Searching the live web news (Google News RSS search) for what outlets say about a claim. Outlets on the two lists below are Tier 2 evidence; every other
  # outlet is Tier 3 and is only shown. Lists and counts are policy choices, not calibrated: they were set by reading results on 2026-10-31.
  endpoint: https://news.google.com/rss/search
  language: en-IN
  region: IN
  edition: IN:en
  timeout_s: 20
  max_query_chars: 120
  max_hits_read: 25
  max_cited: 4
  title_chars: 220
  min_outlets_support: 2
  min_outlets_debunk: 2
  reputable_outlets: ["Reuters", "Associated Press", "AP News", "AFP", "BBC", "BBC News", "Al Jazeera", "The Hindu", "The Indian Express", "Hindustan Times", "The Times of India", "NDTV",
                      "India Today", "The Economic Times", "Business Standard", "Mint", "Livemint", "The Wire", "Scroll.in", "ETV Bharat", "Press Trust of India", "PTI",
                      "The Telegraph", "Deccan Herald", "The New Indian Express", "Firstpost", "CNN", "The Guardian", "The New York Times", "The Washington Post",
                      "Bloomberg", "Financial Times", "Reuters India", "Hindustan Times", "Moneycontrol", "ThePrint", "The Print", "WION", "DD News", "PIB", "Press Information Bureau"]
  fact_checkers: ["Alt News", "BOOM", "BOOM Live", "Factly", "FACTLY", "Newschecker", "Vishvas News", "PIB Fact Check", "Snopes", "PolitiFact", "FactCheck.org", "AFP Fact Check",
                  "Reuters Fact Check", "The Quint", "India Today Fact Check", "Fact Crescendo", "Logically Facts", "Full Fact", "Africa Check", "Misbar", "Lead Stories", "Check4Spam", "Fact Check"]

report:
  db_path: data/reports.sqlite3
  max_record_bytes: 4000000
  max_records_per_report: 12
  thumb_px: 220
  stale_days: 14
  recent_terms: [today, "this morning", tonight, "just now", breaking, "right now", "an hour ago", "this evening", "last night", "आज", "अभी", "आज सुबह", "कुछ देर पहले", "ತಕ್ಷಣ", "ಇಂದು", "ಈಗ"]
  verdict_names:
    en: {SUPPORTED: "SUPPORTED", REFUTED: "FALSE", MISSING_CONTEXT: "MISLEADING", UNVERIFIABLE_YET: "UNVERIFIED", NOT_A_CLAIM: "NOT A CLAIM"}
    hi: {SUPPORTED: "सही", REFUTED: "झूठ", MISSING_CONTEXT: "भ्रामक", UNVERIFIABLE_YET: "अपुष्ट", NOT_A_CLAIM: "दावा नहीं"}
  insufficient_label: {en: INSUFFICIENT EVIDENCE, hi: "पर्याप्त सबूत नहीं"}
  tier_names:
    en: {"1": "Official source", "2": "Reputable outlet or fact-checker", "3": "Other source (shown, never decides)", "4": "Unverified"}
    hi: {"1": "सरकारी स्रोत", "2": "प्रतिष्ठित मीडिया या फैक्ट-चेकर", "3": "अन्य स्रोत (दिखाया जाता है, फ़ैसला नहीं करता)", "4": "असत्यापित"}
  limitations:
    en:
      - "This report lists only what was actually retrieved when it was made; nothing else was consulted."
      - "A missing source is not proof that a claim is false. UNVERIFIED means we could not find enough trusted evidence either way."
      - "News outlets repeat each other and can be wrong, so support from news alone is capped at medium confidence."
      - "Image, video and voice detectors miss some manipulations and can flag genuine files. A clean result is never proof that media is genuine."
      - "Relationships shown in the graph are only those found in this investigation; they are not a map of the whole internet."
    hi:
      - "यह रिपोर्ट केवल वही दिखाती है जो बनाते समय सच में खोजा गया; और कोई स्रोत नहीं देखा गया।"
      - "स्रोत न मिलना दावे के झूठ होने का सबूत नहीं है। 'अपुष्ट' का मतलब है कि दोनों ओर पर्याप्त भरोसेमंद सबूत नहीं मिला।"
      - "समाचार संस्थान एक-दूसरे को दोहराते हैं और ग़लत भी हो सकते हैं, इसलिए सिर्फ़ समाचार से मिला समर्थन मध्यम भरोसे तक सीमित है।"
      - "फ़ोटो, वीडियो और आवाज़ के डिटेक्टर कुछ छेड़छाड़ चूक सकते हैं और असली फ़ाइल को भी संदिग्ध बता सकते हैं। साफ़ नतीजा असली होने का सबूत नहीं है।"
      - "ग्राफ़ में सिर्फ़ वही संबंध हैं जो इस जाँच में मिले; यह पूरे इंटरनेट का नक्शा नहीं है।"

# Submitted links and documents. The page fetch uses our honest User-Agent, follows redirects by hand and refuses any hop that resolves to a
# non-public address (loopback, private, link-local), so a pasted link cannot make this server read its own network. Limits are safety caps, not calibrated.
inputs:
  timeout_s: 15
  max_bytes: 4000000
  max_redirects: 4
  max_pdf_pages: 30
  max_text_chars: 6000
  html_skip_tags: [script, style, noscript, nav, header, footer, aside, form, svg]
  editor_terms: [photoshop, gimp, lightroom, canva, snapseed, picsart, pixlr, affinity, paint.net, facetune, remini, midjourney, stable diffusion, dall-e, firefly]

# Command centre views. Everything is computed from records this instance stored; nothing is live nationwide data and the pages say so.
intel:
  max_records: 500
  same_claim_jaccard: 0.6          # word overlap of two English claim texts above which they count as the same underlying claim (policy choice, not calibrated)
  recent_n: 8
  registry_items: 12
  not_available:
    - {name: Press Information Bureau (PIB), reason: "answers 403 to our honest User-Agent, so it is not read"}
    - {name: Ministry of Health (MoHFW), reason: "answers 403 to our honest User-Agent, so it is not read"}
    - {name: Prime Minister's Office (PMIndia), reason: "answers 403 to our honest User-Agent, so it is not read"}
    - {name: Indian Cybercrime Coordination Centre, reason: "answers 403 to our honest User-Agent; it is only linked as a place to report"}
    - {name: IMD weather and NDMA disaster alerts, reason: "no machine-readable public feed was found, so nothing is connected"}
    - {name: State government portals, reason: "not connected in this build"}

# India pulse: what is being read, searched and rumoured in India right now. It replaces the Bluesky stream as the "what is spreading" source (the stream worker stays off).
# Three lanes, all fetched live: Google Trends India (search terms with the outlets covering them), fact-checkers' newest articles (what people are asking about right now),
# and top headlines in English, Hindi and Kannada clustered across outlets (one story carried by many outlets). It is a window on what Indian media and searchers are
# doing, not a measure of what is spreading on WhatsApp, which no public source shows. The headline cluster cut is a policy choice, not calibrated.
pulse:
  refresh_s: 300
  timeout_s: 15
  workers: 8
  trends_url: https://trends.google.com/trending/rss?geo=IN
  trends_namespace: "{https://trends.google.com/trending/rss}"     # XML namespace of the Trends item fields
  headline_feeds:
    - {id: gnews_en, language: en, publisher: Google News India, url: "https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en"}
    - {id: gnews_nation_en, language: en, publisher: Google News India, url: "https://news.google.com/rss/headlines/section/topic/NATION?hl=en-IN&gl=IN&ceid=IN:en"}
    - {id: gnews_hi, language: hi, publisher: Google News India, url: "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi"}
    - {id: gnews_kn, language: kn, publisher: Google News India, url: "https://news.google.com/rss?hl=kn&gl=IN&ceid=IN:kn"}
    - {id: livehindustan_hi, language: hi, publisher: Live Hindustan, url: "https://www.livehindustan.com/rss/3127"}
    - {id: hindu_in, language: en, publisher: The Hindu, url: "https://www.thehindu.com/news/national/feeder/default.rss"}
    - {id: toi_top, language: en, publisher: Times of India, url: "https://timesofindia.indiatimes.com/rssfeedstopstories.cms"}
    - {id: ndtv_top, language: en, publisher: NDTV, url: "https://feeds.feedburner.com/ndtvnews-top-stories"}
    - {id: ht_india, language: en, publisher: Hindustan Times, url: "https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml"}
    - {id: ie_india, language: en, publisher: The Indian Express, url: "https://indianexpress.com/section/india/feed/"}
    - {id: mint, language: en, publisher: Mint, url: "https://www.livemint.com/rss/news"}
    - {id: indiatoday_nation, language: en, publisher: India Today, url: "https://www.indiatoday.in/rss/1206514"}
  fact_check_feeds:
    - {id: boom_en, language: en, publisher: BOOM, url: "https://www.boomlive.in/feed"}
    - {id: boom_hi, language: hi, publisher: BOOM Hindi, url: "https://hindi.boomlive.in/feed"}
    - {id: altnews_en, language: en, publisher: Alt News, url: "https://www.altnews.in/feed/"}
    - {id: altnews_hi, language: hi, publisher: Alt News Hindi, url: "https://www.altnews.in/hindi/feed/"}
    - {id: factly_en, language: en, publisher: Factly, url: "https://factly.in/feed/"}
    - {id: vishvas_en, language: en, publisher: Vishvas News, url: "https://www.vishvasnews.com/feed/"}
    - {id: vishvas_te, language: te, publisher: Vishvas News Telugu, url: "https://www.vishvasnews.com/telugu/feed/"}
    - {id: newschecker_en, language: en, publisher: Newschecker, url: "https://www.newschecker.in/feed"}
    - {id: newschecker_hi, language: hi, publisher: Newschecker Hindi, url: "https://www.newschecker.in/hi/feed"}
    - {id: newschecker_kn, language: kn, publisher: Newschecker Kannada, url: "https://www.newschecker.in/kn/feed"}
  max_age_hours: 36
  max_rumours: 30
  max_stories: 20
  max_trends: 20
  trend_news_items: 3
  cluster_jaccard: 0.34
  common_word_share: 0.12          # a word in more than this share of headlines is too common to link two of them (measured per refresh, not a fixed list)
  min_token_chars: 3
  min_outlets: 2                   # a story needs this many distinct outlets to be listed as carried by several
