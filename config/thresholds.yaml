# Every threshold carries the model hash, data and date it was calibrated on (Bible D10, I3).
# Empty on purpose: nothing is calibrated yet, and nothing in src/ may invent a value.
thresholds:
  cluster_jaccard:
    value: 0.75
    calibrated_on: 'posts_5min.jsonl: live 5-minute Bluesky capture, 3101 posts; 16
      sample pairs read by hand around 0.75: 7 of 8 above are the same message (1
      templated bot variant), only 4 of 8 below are; chosen to favour pure clusters.
      Command: scripts/calibrate_fastclock.py capture --seconds 300, then analyse.
      General chatter, not a news event: recalibrate during one'
    date: '2026-10-31'
  factcheck_relevance:
    value: 0.9
    calibrated_on: 'live Fact Check API, 46 claim-like queries, 93 (query, review)
      pairs read by hand (2026-10-31): lexical word overlap cannot separate a review
      of the SAME claim from a review of its OPPOSITE (e.g. ''Smoking doesn t cause
      cancer'' scored 0.29 against ''Smoking causes lung cancer'' while true paraphrases
      scored 0.2-0.3), so the cut is set at near-identity; only 1 of 93 pairs passes.
      Reviews below it are shown as related context, never used to decide. Semantic
      matching needs embeddings or NLI (Phase 3). Command: scripts/calibrate_factcheck.py
      collect then relevance'
    date: '2026-10-31'
  image_match_pdq_distance:
    value: 40
    calibrated_on: 'scripts/measure_image_match.py measure on 60 random Wikimedia
      Commons images (1770 unrelated pairs), 2026-10-31: 0 false matches at any distance
      up to 96, closest unrelated pair 100 bits; resize 50 percent, JPEG q40 and horizontal
      flip stayed within 36 bits (all matched at 40); a 90 percent centre crop did
      NOT match (largest 136), so crops are not supported. Random Commons photos are
      more varied than screenshots and flat graphics, so false matches on those are
      not bounded by this sample.'
    date: '2026-10-31'
