# Every threshold carries the model hash, data and date it was calibrated on (Bible D10, I3).
# Empty on purpose: nothing is calibrated yet, and nothing in src/ may invent a value.
thresholds:
  cluster_jaccard:
    value: 0.75
    calibrated_on: 'posts_5min.jsonl: live 5-minute Bluesky capture, 3101 posts; 16
      sample pairs read by hand around 0.75: 7 of 8 above are the same message (1
      templated bot variant), only 4 of 8 below are; chosen to favour pure clusters.
      Command: scripts/calibrate_fastclock.py capture --seconds 300, then analyse.
      General chatter, not a news event: recalibrate during one'
    date: '2026-10-31'
  factcheck_relevance:
    value: 0.9
    calibrated_on: 'live Fact Check API, 46 claim-like queries, 93 (query, review)
      pairs read by hand (2026-10-31): lexical word overlap cannot separate a review
      of the SAME claim from a review of its OPPOSITE (e.g. ''Smoking doesn t cause
      cancer'' scored 0.29 against ''Smoking causes lung cancer'' while true paraphrases
      scored 0.2-0.3), so the cut is set at near-identity; only 1 of 93 pairs passes.
      Reviews below it are shown as related context, never used to decide. Semantic
      matching needs embeddings or NLI (Phase 3). Command: scripts/calibrate_factcheck.py
      collect then relevance'
    date: '2026-10-31'
  image_match_pdq_distance:
    value: 40
    calibrated_on: 'scripts/measure_image_match.py measure on 60 random Wikimedia
      Commons images (1770 unrelated pairs), 2026-10-31: 0 false matches at any distance
      up to 96, closest unrelated pair 100 bits; resize 50 percent, JPEG q40 and horizontal
      flip stayed within 36 bits (all matched at 40); a 90 percent centre crop did
      NOT match (largest 136), so crops are not supported. Random Commons photos are
      more varied than screenshots and flat graphics, so false matches on those are
      not bounded by this sample.'
    date: '2026-10-31'
  escalation_min_authors_per_min:
    value: 0.6
    calibrated_on: 'scripts/calibrate_escalation.py capture --seconds 300 on the live
      Bluesky stream, 2026-10-31: 1216 posts, 1205 clusters; 1205 have 1 distinct
      author, 3 have 2 (a motivational quote, a templated greeting, a weather bot:
      chatter, not spreading claims), none has 3 or more. Floor = 3 distinct authors
      in the 300 s window, so general chatter escalates nothing. General chatter,
      not a news event: recalibrate during one.'
    date: '2026-10-31'
  trufor_manipulation_score:
    value: 0.7
    calibrated_on: 'scripts/calibrate_trufor.py measure --images 30 on the live TruFor
      service (RTX 4060), 2026-10-31: 30 random Wikimedia Commons photos (their thumbnails,
      already JPEG), each untouched, shrunk to 70 percent plus JPEG q80 (''shared''),
      with a 30 percent-side patch spliced in from another photo then shared, and
      with a region copy-moved then shared. At 0.7: false alarms 0 of 30 untouched
      and 1 of 30 shared; detected 63 percent of splices and 20 percent of copy-moves
      (at 0.5, the authors'' usual cut: 3 percent and 10 percent false alarms, 73
      and 33 percent detected). Chosen high because calling a genuine image EDITED
      is the worse error. Limits: 30 images, one detector, large self-made edits (small
      edits will be missed), no AI-generated images and no real-world deepfakes were
      tested, Commons photos are not social-media photos. Recalibrate on labelled
      social-media images.'
    date: '2026-10-31'
  smaug_ai_generated_score:
    value: 0.5
    calibrated_on: 'forensics/smaug_probe.py on 40 Wikimedia Commons files from Category:AI-generated
      images (label = Commons category) and 40 random Commons files (2026-10-31), thumbnails
      640 px wide. At 0.5, the model card default: 36 of 40 AI images caught (90 percent),
      1 of 40 random files flagged (2.5 percent; it may itself be an undeclared AI image
      or a drawing). At 0.9: 78 percent caught. Limits: 80 images, one source, Commons AI
      images are mostly older public generators, the real set is not curated, no social-media
      re-uploads or screenshots tested, newer or evasive generators may slip through, a real
      photo with a small AI-edited region can read as real. The detector''s published accuracy
      is the authors'' own figure and was not reproduced here.'
    date: '2026-10-31'
  audio_synthetic_probability:
    value: 0.9
    model_sha256: 905e330265c40a76955911ce86691fb4c8f2ed9c8085f4f046cac1383592a0ac
    calibrated_on: 'docs/calibration/audio_synthetic_2026-10-31.txt: 20 real clips (mostly old or noisy Commons recordings, one Hindi)
      and 19 synthetic clips (Gemini TTS English and Hindi, Windows SAPI), as collected and after phone-style compression (Opus
      12 kbit/s, 8 kHz). Median window probability of fake at 0.9: 19 of 19 synthetic caught and 0 of 20 real flagged, in both runs.
      Limits: 39 clips, real class is old radio and not modern phone speech, no cloned voices of real people, no ElevenLabs-style
      output, one Indian language only (Hindi, from Gemini), the same clips were used to pick the cut and to report it.'
    date: '2026-10-31'
