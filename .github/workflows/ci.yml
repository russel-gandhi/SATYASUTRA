name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (the voice and video tests decode real audio and video; without it they fail or silently skip)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (contract tests that hit the live internet are excluded)
        run: python -m pytest -q
      - name: No-fixtures guard
        run: python scripts/check_no_fixtures.py
      - name: Ticket check
        run: python tools/forge.py check
