# Claims nobody can have checked: predictions, opinions, fresh local events, vague talk. Any decided label (true or false) is a mistake.
unknowable:
  - {id: u01, text: "The RBI will cut the repo rate by 50 basis points in December."}
  - {id: u02, text: "The rupee will cross 100 to the dollar by next March."}
  - {id: u03, text: "Gold will cost two lakh rupees per 10 grams by the end of next year."}
  - {id: u04, text: "India will win the next cricket world cup."}
  - {id: u05, text: "It will rain heavily in Chennai next Tuesday."}
  - {id: u06, text: "Petrol prices will fall by ten rupees before the next election."}
  - {id: u07, text: "The new tax regime is the best thing that has happened to salaried people."}
  - {id: u08, text: "This government has done more for farmers than any government before it."}
  - {id: u09, text: "Online classes are worse than classroom teaching for every child."}
  - {id: u10, text: "That film is the greatest movie ever made in India."}
  - {id: u11, text: "A water pipe burst near our colony and supply will stop for three days."}
  - {id: u12, text: "The weekly market in our town will be shut tomorrow because of a strike."}
  - {id: u13, text: "My neighbour's cousin got a government job after paying an agent."}
  - {id: u14, text: "The bus from our village to the district hospital has stopped running this week."}
  - {id: u15, text: "A new shopping mall is going to open near the railway station next year."}
  - {id: u16, text: "Many people are saying the new scheme has problems."}
  - {id: u17, text: "Everyone I know says prices are going up."}
  - {id: u18, text: "Something big is going to happen on the stock market soon."}
  - {id: u19, text: "They are hiding the real numbers from us."}
  - {id: u20, text: "The ministry is planning a surprise announcement for farmers."}
  - {id: u21, text: "A famous cricketer will announce his retirement next month."}
  - {id: u22, text: "Electricity bills will double next year."}
  - {id: u23, text: "Our school will start the exams a week earlier this year."}
  - {id: u24, text: "The monsoon will be weaker than normal next year."}
  - {id: u25, text: "Mobile data plans will become free for students soon."}

# False claims whose falseness we can show from sources we hold today (the PM claim: no outlet reports it and the PM was active on 31 Oct;
# the others: the RBI release of 30 Oct says otherwise). Unlike a changed number, the contrast route does not cover names or places,
# so "cannot tell" is the expected honest result for r02 to r04 today; REFUTED would be a win, SUPPORTED a serious failure.
rumours:
  - {id: r01, source_match: "", text: "Prime Minister Modi was assassinated this morning.", notes: "No major outlet reports it; the PM was active on 31 Oct 2026 (ISRO launch congratulation). Verified by hand on 31 Oct."}
  - {id: r02, source_match: "625", text: "Shaktikanta Das is the current Governor of the Reserve Bank of India.", notes: "The RBI release of 30 Oct names Sanjay Malhotra as Governor."}
  - {id: r03, source_match: "625", text: "The 625th meeting of the Central Board of the Reserve Bank of India was chaired by Shaktikanta Das.", notes: "Chaired by Governor Sanjay Malhotra per the release."}
  - {id: r04, source_match: "625", text: "The 625th meeting of the Central Board of the Reserve Bank of India was held in New Delhi.", notes: "Held in Mumbai per the release."}
  - {id: r05, source_match: "", text: "Chandrayaan-3 will land on the Moon next week.", notes: "Old event stated as upcoming: the landing was in August 2023. Tests whether old headlines make the web rule call it true. One labeller."}
  - {id: r06, source_match: "", text: "The Reserve Bank of India has announced tonight that 500 and 1000 rupee notes will stop being legal tender.", notes: "Old event (November 2016) stated as new. Tests recycled headlines. One labeller."}
  - {id: r07, source_match: "", text: "5G towers spread the coronavirus.", notes: "Debunked rumour that outlets mostly report in order to debunk it. Tests whether reports of the rumour are read as support. One labeller."}
  - {id: r08, source_match: "", text: "Drinking cow urine cures COVID-19.", notes: "Debunked rumour that outlets report in order to debunk it. Tests the same. One labeller."}

