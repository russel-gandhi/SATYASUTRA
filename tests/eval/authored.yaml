# Hand-written claim rows for the verdict dataset (BUILD spec: docs/SPEC_REPLY_SPREAD_EVAL.md, package D1). Recorded test data only; never read by src/.
# assemble.py turns this file, the old eval/claims.yaml, the official snapshot and tests/eval/f_rows.jsonl into tests/eval/claims.jsonl.
#
# truth: true | false | unknown   (see scripts/eval/lib.py RULES for what counts as right and as harmful)
# T rows are true sentences taken from official releases in tests/eval/official_snapshot.jsonl; `source_match` is a piece of the release title,
#   `slot` is the number a rumour would change and `kind` says how (percent, amount, count). Every T row with a slot gets a changed-number twin (C row).
# Labels for T rows come from the release text, not from anyone's opinion. Labels for U and R rows were written by one labeller and
#   still need a second, independent look (review_status: pending_second_labeller).

official_true:
  - {id: t01, source_match: "Premature redemption under Sovereign Gold Bond", slot: "14,167", kind: amount,
     text: "The RBI has set the redemption price for premature redemption of Sovereign Gold Bond 2021-22 Series VII due on November 2, 2026 at ₹14,167 per unit."}
