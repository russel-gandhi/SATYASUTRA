# Scam Guard evaluation set (package SG5). Written by us from public descriptions of how each scam type runs (police and bank awareness pages, the national cyber-fraud
# portal's published guidance, press reports); no real victim's call is used. Each item is a list of chunks, one chunk per ~6 seconds of call.
# Ordinary calls include hard negatives: a bank's real fraud warning, a genuine KYC reminder, a courier. Hindi and Hinglish items are our drafts, NOT reviewed by a native speaker.
# Honest limits: the rules were written by the same people who wrote this set, so scores here are optimistic; one labeller; real audio, accents and scammer variety are not covered.
items:
  # ---- scams ----
  - {id: s01, kind: scam, type: digital_arrest, lang: en, source: "press reports of 'digital arrest' calls", chunks: ["Hello, this is Inspector Sharma from the cyber crime branch.", "A parcel in your name was seized at customs and it has drugs in it.", "A case has been registered and a warrant is out, you will be arrested today.", "Do not tell anyone. Stay on the line and transfer the money to the safe account to clear your name."]}
  - {id: s02, kind: scam, type: digital_arrest, lang: hi, source: "same type, Hindi draft", chunks: ["नमस्ते, मैं मुंबई पुलिस साइबर सेल से बोल रहा हूँ।", "आपके आधार से जुड़ा एक केस दर्ज हुआ है, वारंट निकला है।", "आपको गिरफ्तार किया जाएगा, किसी को मत बताना और फ़ोन मत काटिए।", "बचना है तो सेफ अकाउंट में पैसे ट्रांसफर कीजिए।"]}
  - {id: s03, kind: scam, type: digital_arrest, lang: hinglish, source: "same type, Hinglish draft", chunks: ["Main CBI officer bol raha hoon, aapke naam par ek parcel pakda gaya hai.", "Aapka case ho gaya hai, arrest ho jaoge agar abhi cooperate nahi kiya.", "Kisi ko mat batana aur safe account mein paise transfer karo."]}
  - {id: s04, kind: scam, type: bank_or_code_request, lang: en, source: "bank KYC scam descriptions", chunks: ["Sir, I am calling from your bank. Your KYC is expired and your account will be blocked today.", "To update it I will send you a code. Please tell me the OTP you receive."]}
  - {id: s05, kind: scam, type: bank_or_code_request, lang: hi, source: "same, Hindi draft", chunks: ["मैं आपके बैंक से बोल रहा हूँ, आपका केवाईसी अपडेट नहीं है, खाता बंद हो जाएगा।", "आपके फ़ोन पर ओटीपी आया होगा, वह बताइए।"]}
  - {id: s06, kind: scam, type: bank_or_code_request, lang: hinglish, source: "same, Hinglish draft", chunks: ["Aapka credit card block ho jayega, main bank se bol raha hoon.", "Card number batao aur jo OTP aaya hai woh bhi bataiye."]}
  - {id: s07, kind: scam, type: remote_access_scam, lang: en, source: "fake customer care scams", chunks: ["I am from the refund department of the delivery company, we owe you a refund.", "Please install AnyDesk from the app store and tell me the nine digit code.", "Now share your screen so I can process the refund."]}
  - {id: s08, kind: scam, type: remote_access_scam, lang: hinglish, source: "same, Hinglish draft", chunks: ["Aapka refund aaya hai, customer care se bol raha hoon.", "App install karo, AnyDesk, aur screen share karo."]}
  - {id: s09, kind: scam, type: family_emergency, lang: en, source: "relative-in-trouble scams", chunks: ["Hello uncle, your son is in custody, he had an accident and hit someone.", "The police will let him go if you send money right now, do not tell his mother."]}
  - {id: s10, kind: scam, type: family_emergency, lang: hi, source: "same, Hindi draft", chunks: ["आपका बेटा हिरासत में है, उसका एक्सीडेंट हुआ है।", "अभी पैसे भेजिए वरना केस हो जाएगा, घर वालों को मत बताना।"]}
  - {id: s11, kind: scam, type: payment_demand, lang: en, source: "electricity cut-off scams", chunks: ["This is the electricity board. Your bill is unpaid and the power will be cut tonight.", "Pay the fine now by transfer money to this number or your connection will be disconnected."]}
  - {id: s12, kind: scam, type: payment_demand, lang: hinglish, source: "same, Hinglish draft", chunks: ["Bijli vibhag se bol raha hoon, aapka bill pending hai, connection kat jayega.", "Abhi fine bharo, paise bhejo is number par."]}
  - {id: s13, kind: scam, type: payment_demand, lang: en, source: "task and job scams", chunks: ["Congratulations, you are selected for a work from home job.", "To start you must pay a security deposit by gift card, then you earn daily."]}
  - {id: s14, kind: scam, type: digital_arrest, lang: en, source: "TRAI SIM scams", chunks: ["This is a call from TRAI. Your SIM will be blocked within thirty minutes for illegal activity.", "A case is registered. Speak to the police officer on this line, do not disconnect."]}
  - {id: s15, kind: scam, type: bank_or_code_request, lang: en, source: "loan and UPI tricks", chunks: ["Your loan is approved, we only need your UPI PIN to credit the amount.", "Please read out the PIN and the card number now."]}
  - {id: s16, kind: scam, type: remote_access_scam, lang: en, source: "fake support", chunks: ["Your computer has a virus, I am from technical support.", "Download TeamViewer and give me access to fix it, it is urgent."]}
  # ---- ordinary calls (hard negatives first) ----
  - {id: n01, kind: ordinary, type: bank_warning, lang: en, source: "typical real bank awareness call", chunks: ["Hello, this is an awareness message from your bank.", "We will never ask you for your OTP, PIN or card number on a call. Please do not share them with anyone.", "If anyone asks, hang up and call the number on the back of your card."]}
  - {id: n02, kind: ordinary, type: bank_warning, lang: hi, source: "same, Hindi draft", chunks: ["यह आपके बैंक की ओर से जागरूकता संदेश है।", "बैंक आपसे ओटीपी या पिन कभी नहीं मांगता, इसे किसी से साझा न करें।"]}
  - {id: n03, kind: ordinary, type: bank_warning, lang: hinglish, source: "same, Hinglish draft", chunks: ["Bank ki taraf se ek zaroori suchna.", "Bank kabhi nahi mangta OTP ya PIN, kisi ke saath share na karein."]}
  - {id: n04, kind: ordinary, type: kyc_reminder, lang: en, source: "genuine KYC reminder", chunks: ["Hello, this is a reminder from your bank branch.", "Your KYC documents are due. Please visit the branch with your Aadhaar and PAN card at your convenience."]}
  - {id: n05, kind: ordinary, type: courier, lang: en, source: "courier call", chunks: ["Hi, I am the delivery person, I am at your gate with a parcel.", "Which floor are you on, should I leave it with the guard?"]}
  - {id: n06, kind: ordinary, type: courier, lang: hi, source: "same, Hindi draft", chunks: ["नमस्ते, मैं कूरियर वाला बोल रहा हूँ, पार्सल लेकर नीचे खड़ा हूँ।", "आप किस मंज़िल पर हैं?"]}
  - {id: n07, kind: ordinary, type: doctor, lang: en, source: "appointment", chunks: ["Good morning, this is the clinic calling to confirm your appointment tomorrow at ten.", "Please bring your previous reports. Thank you."]}
  - {id: n08, kind: ordinary, type: family, lang: hinglish, source: "family chat", chunks: ["Haan mummy, main office se nikal gaya hoon, raat ko khana khane aaunga.", "Papa ki dawai le li hai, tum chinta mat karo."]}
  - {id: n09, kind: ordinary, type: family, lang: en, source: "family chat", chunks: ["Hi dad, the match starts at seven, I will call you after.", "Can you send me the address of the restaurant on WhatsApp?"]}
  - {id: n10, kind: ordinary, type: electricity, lang: en, source: "utility call that asks for nothing", chunks: ["This is the electricity office. There will be a planned maintenance cut tomorrow from two to four.", "You do not need to do anything. Thank you for your patience."]}
  - {id: n11, kind: ordinary, type: shop, lang: en, source: "shop pickup", chunks: ["Your order is ready for pickup at the store.", "Please bring the order number you got by SMS. We are open until eight."]}
  - {id: n12, kind: ordinary, type: friend, lang: hinglish, source: "friend call", chunks: ["Yaar kal ka plan kya hai, movie dekhne chalein?", "Main abhi bahar hoon, ghar pahunch ke call karta hoon."]}
  - {id: n13, kind: ordinary, type: bank_service, lang: en, source: "genuine bank call, no secrets asked", chunks: ["Good afternoon, I am calling from your bank about your credit card statement.", "Your due date is the fifteenth. You can pay from the app or at any branch, there is no urgency."]}
  - {id: n14, kind: ordinary, type: police_verification, lang: en, source: "real police verification visit notice", chunks: ["This is the local police station, we are doing the routine tenant verification for your building.", "An officer will visit tomorrow morning with a form. Please keep your rent agreement ready."]}
  - {id: n15, kind: ordinary, type: school, lang: hi, source: "school", chunks: ["नमस्ते, स्कूल से बोल रही हूँ, कल अभिभावक बैठक है।", "कृपया सुबह दस बजे तक आ जाइए।"]}
  - {id: n16, kind: ordinary, type: delivery_otp, lang: en, source: "a delivery that really asks an OTP from the customer (a known gray case: this one SHOULD false-alarm, and is kept to show it)", chunks: ["Hi, I have your food order at the door.", "Can you tell me the OTP from your app so I can hand it over?"]}
