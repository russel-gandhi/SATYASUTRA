<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command centre</title>
<link rel="stylesheet" href="/static/jv.css">
<style>
  :root { --purple: #b07aff; }
  .jnav { padding-inline: 22px; }
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
  .kpi.bad { border-top-color: var(--bad); } .kpi.ok { border-top-color: var(--ok); } .kpi.warn { border-top-color: var(--warn); } .kpi.idle { border-top-color: var(--idle); }
  .kpi .klabel { color: var(--mute); font-size: 13px; } .kpi b { font-size: 38px; line-height: 1.05; letter-spacing: -.02em; }
  .dash { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; align-items: start; }
  .dash .span2 { grid-column: span 2; } @media (max-width: 1000px) { .dash { grid-template-columns: 1fr; } .dash .span2 { grid-column: auto; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .panel h3 { margin: 0 0 12px; font-size: 15px; }
  .donutbox { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; } .donut { width: 150px; height: 150px; flex: none; }
  .dmid { font: 700 22px system-ui, sans-serif; fill: var(--text); } .dsub { font: 11px system-ui, sans-serif; fill: var(--mute); }
  .dlegend { flex: 1; min-width: 180px; display: grid; gap: 8px; } .dl { display: grid; grid-template-columns: 12px 1fr auto 42px; gap: 10px; align-items: center; } .dl i { width: 12px; height: 12px; border-radius: 4px; display: block; } .dl .small { text-align: right; }
  .cols { display: flex; gap: 18px; align-items: flex-end; height: 150px; overflow-x: auto; } .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 44px; }
  .cb { width: 34px; background: var(--accent); border-radius: 6px 6px 0 0; } .cv { font-weight: 700; font-size: 13px; }
  .brow { grid-template-columns: minmax(70px, 120px) 1fr 30px; } .brow > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bar { height: 10px; min-width: 6px; }
  .it .badge { display: inline-block; width: auto; } .it .title { margin-top: 2px; } .foot { margin-top: 16px; }
  .main.full { max-width: none; padding: 14px 16px 16px; }
  .gshell { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; height: calc(100vh - 180px); min-height: 520px; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .grail, .gdetail { padding: 14px; overflow: auto; } .grail { border-right: 1px solid var(--line); } .gdetail { border-left: 1px solid var(--line); }
  .grail h3 { margin: 0 0 8px; font-size: 14px; }
  .gsearch { width: 100%; margin-bottom: 8px; }
  .gitem { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: transparent; color: var(--text); border: 0; border-radius: 8px; padding: 8px; cursor: pointer; font: inherit; font-size: 13px; }
  .gitem:hover, .gitem.on { background: var(--accent-soft); } .gitem i { width: 10px; height: 10px; border-radius: 50%; display: block; } .gitem .gt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gstage2 { position: relative; background: radial-gradient(700px 420px at 50% 50%, var(--accent-soft), var(--bg)); min-width: 0; }
  .gsvg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
  .gsvg .ctext { font: 700 13px "Segoe UI", system-ui, sans-serif; fill: var(--text); } .gsvg .cverdict { font: 800 15px "Segoe UI", system-ui, sans-serif; }
  .gsvg .ini { font: 700 12px "Segoe UI", system-ui, sans-serif; fill: var(--text); } .gsvg .nlab { font: 12px "Segoe UI", "Noto Sans Devanagari", system-ui, sans-serif; fill: var(--text); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .gsvg .gnode circle { transition: stroke-width .12s; } .gsvg .gnode:hover circle, .gsvg .gnode.sel circle { stroke-width: 6; }
  .gchips { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; right: 120px; }
  .gchip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; } .gchip i { width: 9px; height: 9px; border-radius: 50%; } .gchip.off { opacity: .45; text-decoration: line-through; }
  .gzoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; } .gzoom button { width: 38px; height: 34px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; font-size: 15px; }
  .gempty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
  .gkind { color: var(--mute); font-size: 12px; margin: 12px 0 4px; } .gkind:first-child { margin-top: 0; } .gtitle { font-weight: 700; line-height: 1.35; margin-bottom: 8px; overflow-wrap: anywhere; }
  .gdl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; margin: 10px 0; } .gdl dt { color: var(--mute); } .gdl dd { margin: 0; }
  .btnlink { display: inline-block; margin-top: 6px; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; font-size: 13px; }
  @media (max-width: 1100px) { .gshell { grid-template-columns: 1fr; height: auto; } .gstage2 { height: 70vh; } .grail { border-right: 0; max-height: 220px; } .gdetail { border-left: 0; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", "Noto Sans Kannada", sans-serif; }
  .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; }
  .side .who { font-size: 12px; color: var(--mute); padding: 0 10px 12px; }
  .main { padding: 18px 22px 50px; max-width: 1240px; }
  @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .side { border-right: 0; border-bottom: 1px solid var(--line); } }
  h1 { font-size: 20px; margin: 4px 0; } h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .small { color: var(--mute); font-size: 12px; }
  .tabs { display: flex; flex-direction: column; gap: 2px; }
  .tabs button { background: transparent; color: var(--mute); border: 0; border-radius: 8px; padding: 10px 12px; font: inherit; cursor: pointer; text-align: left; }
  .tabs button:hover { background: var(--accent-soft); color: var(--text); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  @media (max-width: 860px) { .tabs { flex-direction: row; flex-wrap: wrap; } }
  button.b { background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font: inherit; cursor: pointer; }
  button.p { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-bottom: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; } .tile b { display: block; font-size: 30px; line-height: 1.1; }
  .brow { display: grid; grid-template-columns: 130px 1fr 34px; gap: 8px; align-items: center; margin: 3px 0; font-size: 13px; }
  .bar { height: 9px; border-radius: 5px; background: var(--accent); } .bar.bad { background: var(--bad); } .bar.ok { background: var(--ok); } .bar.warn { background: var(--warn); } .bar.idle { background: var(--idle); }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #0b0f17; margin-right: 4px; }
  .badge.bad { background: var(--bad); } .badge.ok { background: var(--ok); } .badge.warn { background: var(--warn); } .badge.idle { background: var(--idle); color: #fff; }
  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; }
  textarea { width: 100%; min-height: 64px; } .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  .it { border-top: 1px solid var(--line); padding: 8px 0; } .it:first-child { border-top: 0; } .title { overflow-wrap: anywhere; font-weight: 600; }
  a { color: var(--accent); } img.th { max-width: 150px; border-radius: 8px; border: 1px solid var(--line); }
  .gwrap { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) 300px; } @media (max-width: 860px) { .gwrap { grid-template-columns: 1fr; } }
  svg.g { width: 100%; height: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  svg text { fill: var(--text); font: 11px system-ui, "Noto Sans Devanagari", sans-serif; pointer-events: none; }
  .legend span { margin-right: 10px; white-space: nowrap; } .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; margin: 2px 4px 2px 0; color: var(--mute); }
  .t1, .t2 { color: var(--ok); }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="who">Command centre<br>for journalists, fact-checkers and officials</div>
    <div class="tabs" id="tabs"></div>
  </aside>
  <div class="main">
    <h1 id="vtitle">Intelligence overview</h1>
    <div class="small">Every number comes from the investigations stored on this server. It is not live or nationwide data. No sign-in in this build, so anyone who can open this page sees all stored investigations.</div>
    <div id="view" style="margin-top:14px"></div>
  </div>
</div>
<script src="/static/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const jget = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status); return r.json(); };
const jpost = async (u, b) => { const r = await fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status); return r.json(); };
const NAME = { SUPPORTED: ["SUPPORTED", "ok"], REFUTED: ["FALSE", "bad"], MISSING_CONTEXT: ["MISLEADING", "warn"], UNVERIFIABLE_YET: ["UNVERIFIED", "idle"], NOT_A_CLAIM: ["NOT A CLAIM", "idle"],
  EDITED: ["EDITED", "bad"], SYNTHETIC_SUSPECTED: ["AI-GENERATED?", "warn"], SYNTHETIC: ["AI-GENERATED", "bad"], OUT_OF_CONTEXT: ["OUT OF CONTEXT", "warn"], INCONCLUSIVE: ["NO SIGN FOUND", "idle"] };
const badge = (v) => { const n = NAME[v] || [v, "idle"]; return el("span", "badge " + n[1], n[0]); };
const when = (s) => s.slice(0, 16).replace("T", " ") + " UTC";

function bars(counts, cls) {
  const box = el("div"), max = Math.max(1, ...Object.values(counts));
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => { const r = el("div", "brow"); r.append(el("span", "", (NAME[k] || [k])[0]), Object.assign(el("div", "bar " + ((NAME[k] || [])[1] || cls || "")), { style: `width:${(100 * n) / max}%` }), el("span", "small", String(n))); box.append(r); });
  if (!Object.keys(counts).length) box.append(el("div", "small", "Nothing yet."));
  return box;
}
const card = (title, ...kids) => { const c = el("div", "card"); c.append(el("h2", "", title), ...kids); return c; };
function recentList(items) {
  const box = el("div"); items.forEach((i) => { const d = el("div", "it"); i.verdicts.forEach((v) => d.append(badge(v))); d.append(el("span", "small", i.kind + " · " + when(i.created_at)), el("div", "title", i.title)); box.append(d); });
  if (!items.length) box.append(el("div", "small", "Nothing yet."));
  return box;
}

const KIND = { claims: "Text claims", media: "Images", video: "Videos", voice: "Voice notes", audio: "Voice checks", notice: "Notices", page: "Web pages", doc: "PDFs" };
const LANG = { en: "English", hi: "Hindi", kn: "Kannada", ta: "Tamil", te: "Telugu", ml: "Malayalam", mr: "Marathi", bn: "Bengali", gu: "Gujarati", pa: "Punjabi", ur: "Urdu" };
const TONE_VAR = { bad: "var(--bad)", ok: "var(--ok)", warn: "var(--warn)", idle: "var(--idle)" };
const panel = (title, body, cls) => { const c = el("section", "panel " + (cls || "")); c.append(el("h3", "", title), body); return c; };
const SVGNS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); Object.entries(attrs || {}).forEach(([k, x]) => e.setAttribute(k, x)); return e; };

function donut(counts) {
  const box = el("div", "donutbox"), total = Object.values(counts).reduce((a, b) => a + b, 0);
  if (!total) { box.append(el("div", "small", "Nothing yet.")); return box; }
  const svg = svgEl("svg", { viewBox: "0 0 120 120", class: "donut", role: "img", "aria-label": "Verdict split" }), R = 46, C = 2 * Math.PI * R; let off = 0;
  svg.append(svgEl("circle", { cx: 60, cy: 60, r: R, fill: "none", stroke: "var(--idle-soft, #25304e)", "stroke-width": 16 }));
  const legend = el("div", "dlegend");
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([k, c]) => {
    const nm = NAME[k] || [k, "idle"], len = (c / total) * C;
    svg.append(svgEl("circle", { cx: 60, cy: 60, r: R, fill: "none", stroke: TONE_VAR[nm[1]], "stroke-width": 16, "stroke-dasharray": len + " " + (C - len), "stroke-dashoffset": -off, transform: "rotate(-90 60 60)" }));
    off += len;
    const row = el("div", "dl"); row.append(Object.assign(el("i"), { style: "background:" + TONE_VAR[nm[1]] }), el("span", "", nm[0]), el("b", "", String(c)), el("span", "small", Math.round((100 * c) / total) + "%")); legend.append(row);
  });
  const mid = svgEl("text", { x: 60, y: 62, "text-anchor": "middle", class: "dmid" }); mid.textContent = String(total);
  const sub = svgEl("text", { x: 60, y: 76, "text-anchor": "middle", class: "dsub" }); sub.textContent = "verdicts";
  svg.append(mid, sub); box.append(svg, legend); return box;
}

function columns(perDay) {
  const days = Object.entries(perDay).sort(), max = Math.max(1, ...days.map((d) => d[1])), box = el("div", "cols");
  if (!days.length) { box.append(el("div", "small", "Nothing yet.")); return box; }
  days.forEach(([d, c]) => { const col = el("div", "col"); col.append(el("span", "cv", String(c)), Object.assign(el("div", "cb"), { style: "height:" + Math.max(6, (100 * c) / max) + "px" }), el("span", "small", d.slice(5))); box.append(col); });
  return box;
}

// Evidence graph explorer: pick a claim on the left and see only its own evidence, arranged by what each source says about it
// (supports on the right, contradicts on the left, mentioned people above, context below). A force layout of every node at once is unreadable.
const GROUPS = [
  { key: "supports", name: "Supports", color: "#3ecf8e", angle: 0, span: 110 },
  { key: "contradicts", name: "Contradicts", color: "#ff6b74", angle: 180, span: 130 },
  { key: "context", name: "Context only", color: "#8d98b5", angle: 90, span: 120 },
  { key: "entity", name: "People and places", color: "#b07aff", angle: 270, span: 90 },
  { key: "media", name: "Images", color: "#f5b84b", angle: 315, span: 60 },
];
const REL_GROUP = { supports: "supports", contradicts: "contradicts", context: "context", related_not_used: "context", mentions: "entity", submitted_with: "media" };
const SHORT = (label) => { const i = label.indexOf(":"); return i > 0 && i < 40 ? [label.slice(0, i), label.slice(i + 1).trim()] : ["", label]; };
const initials = (s) => (s.match(/[A-Za-zऀ-෿0-9]+/g) || ["?"]).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

function focusOf(g, claimId) {
  const byId = Object.fromEntries(g.nodes.map((n) => [n.id, n])), items = [];
  g.edges.filter((e) => e.to === claimId || e.from === claimId).forEach((e) => {
    const other = byId[e.from === claimId ? e.to : e.from]; if (!other) return;
    const grp = REL_GROUP[e.relation] || (other.kind === "entity" ? "entity" : "context");
    items.push({ node: other, relation: e.relation, group: grp, rating: e.rating || "", why: e.why || "" });
    if (other.kind === "entity") g.edges.filter((x) => x.to === other.id && x.relation === "records").forEach((x) => { const f = byId[x.from]; if (f) items.push({ node: f, relation: "records", group: "entity", rating: "", why: "" }); });
  });
  return items;
}

function explorer(g) {
  const root = el("div", "gshell"), rail = el("aside", "grail"), stage = el("div", "gstage2"), side = el("aside", "gdetail");
  const claims = g.nodes.filter((n) => n.kind === "claim").map((c) => ({ ...c, count: g.edges.filter((e) => e.to === c.id || e.from === c.id).length })).sort((a, b) => b.count - a.count);
  const search = Object.assign(el("input", "gsearch"), { type: "search", placeholder: "Search claims" }), list = el("div", "glist");
  rail.append(el("h3", "", "Claims"), search, list);
  let current = null, hidden = new Set(), sel = null;

  const drawList = () => {
    const q = search.value.trim().toLowerCase(); list.replaceChildren();
    claims.filter((c) => !q || c.label.toLowerCase().includes(q)).forEach((c) => {
      const row = el("button", "gitem" + (current && current.id === c.id ? " on" : "")), tone = (NAME[c.verdict] || ["", "idle"])[1];
      row.append(Object.assign(el("i"), { style: "background:" + TONE_VAR[tone] }), el("span", "gt", c.label), el("span", "small", c.count + " links")); row.onclick = () => focus(c); list.append(row);
    });
    if (!list.children.length) list.append(el("div", "small", "No claims match."));
  };
  search.oninput = drawList;

  function focus(c) { current = c; sel = c.id; hidden = new Set(); drawList(); drawStage(); showDetail(c, null); }

  function drawStage() {
    stage.replaceChildren();
    const items = focusOf(g, current.id), chips = el("div", "gchips");
    const counts = Object.fromEntries(GROUPS.map((gr) => [gr.key, items.filter((i) => i.group === gr.key).length]));
    GROUPS.filter((gr) => counts[gr.key]).forEach((gr) => { const b = el("button", "gchip" + (hidden.has(gr.key) ? " off" : "")); b.append(Object.assign(el("i"), { style: "background:" + gr.color }), gr.name + " " + counts[gr.key]); b.onclick = () => { hidden.has(gr.key) ? hidden.delete(gr.key) : hidden.add(gr.key); drawStage(); }; chips.append(b); });
    const svg = svgEl("svg", { class: "gsvg" }), cx = 0, cy = 0, placed = [];
    GROUPS.forEach((gr) => {
      if (hidden.has(gr.key)) return;
      const its = items.filter((i) => i.group === gr.key), n = its.length; if (!n) return;
      const span = Math.min(gr.span, Math.max(30, n * 17)), start = gr.angle - span / 2;
      its.forEach((it, i) => {
        const a = ((n === 1 ? gr.angle : start + (span * i) / (n - 1)) * Math.PI) / 180, ring = 250 + (i % 2) * 95 + Math.floor(n / 9) * 30;
        placed.push({ it, gr, x: cx + ring * Math.cos(a), y: cy + ring * Math.sin(a) });
      });
    });
    const edges = svgEl("g"), nodes = svgEl("g");
    placed.forEach((p) => edges.append(svgEl("line", { x1: cx, y1: cy, x2: p.x, y2: p.y, stroke: p.gr.color, "stroke-width": p.gr.key === "supports" || p.gr.key === "contradicts" ? 2.2 : 1.2, opacity: p.gr.key === "context" ? 0.45 : 0.75, "stroke-dasharray": p.gr.key === "context" ? "4 4" : "" })));
    const tone = (NAME[current.verdict] || ["", "idle"])[1], cc = TONE_VAR[tone];
    const center = svgEl("g", { class: "gnode", style: "cursor:pointer" });
    center.append(svgEl("circle", { cx, cy, r: 62, fill: "var(--panel)", stroke: cc, "stroke-width": 5 }));
    const words = current.label.split(" "), lines = []; let ln = ""; words.forEach((w) => { if ((ln + " " + w).trim().length > 16 && ln) { lines.push(ln); ln = w; } else ln = (ln + " " + w).trim(); }); lines.push(ln);
    lines.slice(0, 4).forEach((t, i, arr) => { const x = svgEl("text", { x: cx, y: cy + (i - (arr.length - 1) / 2) * 15 + 4, "text-anchor": "middle", class: "ctext" }); x.textContent = t.length > 17 ? t.slice(0, 16) + "…" : t; center.append(x); });
    const vt = svgEl("text", { x: cx, y: cy + 84, "text-anchor": "middle", class: "cverdict", fill: cc }); vt.textContent = (NAME[current.verdict] || [current.verdict])[0]; center.append(vt);
    center.onclick = () => showDetail(current, null); nodes.append(center);
    placed.forEach((p) => {
      const n = p.it.node, [outlet, title] = SHORT(n.label), g1 = svgEl("g", { class: "gnode" + (sel === n.id ? " sel" : ""), style: "cursor:pointer", transform: "translate(" + p.x + "," + p.y + ")" });
      g1.append(svgEl("circle", { r: 24, fill: "var(--panel)", stroke: p.gr.color, "stroke-width": 3 }));
      const ini = svgEl("text", { "text-anchor": "middle", y: 5, class: "ini" }); ini.textContent = n.kind === "entity" ? "◉" : initials(outlet || n.label); g1.append(ini);

const KIND_COLOR = { claim: "#7aa2ff", entity: "#8b95ab", factcheck: "#3ecf8e", news: "#3ecf8e", official: "#3ecf8e", media: "#f5b84b", cluster: "#b07aff", registry: "#8b95ab", source: "#8b95ab", provenance: "#f5b84b" };

  side.append(el("h2", "", "Relationships (" + rel.length + ")")); rel.forEach((e) => { const o = byId[e.from === n.id ? e.to : e.from]; if (o) side.append(el("div", "it", (e.from === n.id ? e.relation + " → " : "← " + e.relation + " ") + o.label.slice(0, 70))); });

function forceGraph(g, on, pick) {

    edges.forEach((e) => { const a = nodes[idx[e.from]], b = nodes[idx[e.to]]; const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01, f = (d - 130) * 0.02; a.vx += (dx / d) * f; a.vy += (dy / d) * f; b.vx -= (dx / d) * f; b.vy -= (dy / d) * f; });
    nodes.forEach((n) => { n.vx += (W / 2 - n.x) * 0.004; n.vy += (H / 2 - n.y) * 0.004; n.x = Math.max(30, Math.min(W - 30, n.x + n.vx * 0.5)); n.y = Math.max(20, Math.min(H - 20, n.y + n.vy * 0.5)); n.vx *= 0.6; n.vy *= 0.6; });
  }
  const mk = (t, a, x) => { const e = document.createElementNS(ns, t); Object.entries(a || {}).forEach(([k, v]) => e.setAttribute(k, v)); if (x != null) e.textContent = x; return e; };
  const lines = edges.map((e) => { const l = mk("line", { stroke: EDGE_COLOR[e.relation] || "#8b95ab", "stroke-width": e.relation === "supports" || e.relation === "contradicts" ? 2 : 1, opacity: 0.8 }); svg.append(l); return [l, e]; });
  const gs = nodes.map((n) => { const gr = mk("g", { style: "cursor:pointer", class: "k-" + n.kind }); gr.append(mk("circle", { r: n.kind === "claim" ? 12 : 8, fill: KIND_COLOR[n.kind] || "#8b95ab", stroke: "#0b0f17", "stroke-width": 1.5 }), mk("text", { x: 14, y: 4 }, n.label.slice(0, n.kind === "claim" ? 60 : 40))); gr.append(mk("title", {}, n.label)); gr.onclick = () => pick(n);
    gr.onmousedown = (ev) => { ev.preventDefault(); const move = (m) => { const r = svg.getBoundingClientRect(); n.x = vb[0] + ((m.clientX - r.left) / r.width) * vb[2]; n.y = vb[1] + ((m.clientY - r.top) / r.height) * vb[3]; place(); }; const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); }; window.addEventListener("mousemove", move); window.addEventListener("mouseup", up); };
    svg.append(gr); return gr; });
  function place() { lines.forEach(([l, e]) => { const a = nodes[idx[e.from]], b = nodes[idx[e.to]]; l.setAttribute("x1", a.x); l.setAttribute("y1", a.y); l.setAttribute("x2", b.x); l.setAttribute("y2", b.y); }); gs.forEach((gr, i) => gr.setAttribute("transform", `translate(${nodes[i].x},${nodes[i].y})`)); }
  let vb = [0, 0, W, H];
  const setVb = () => svg.setAttribute("viewBox", vb.map((x) => x.toFixed(1)).join(" "));

  svg.addEventListener("mousedown", (ev) => { if (ev.target !== svg) return; const x0 = ev.clientX, y0 = ev.clientY, o = [...vb], r = svg.getBoundingClientRect(); const move = (m) => { vb = [o[0] - ((m.clientX - x0) / r.width) * o[2], o[1] - ((m.clientY - y0) / r.height) * o[3], o[2], o[3]]; setVb(); }; const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); }; window.addEventListener("mousemove", move); window.addEventListener("mouseup", up); });
  place(); return svg;
}

const TABS = [["overview", "Intelligence overview"], ["graph", "Evidence graph explorer"], ["media", "Media forensics lab"], ["claims", "Claim intelligence"], ["registry", "Bharat registry"], ["workspace", "Investigation workspace"]];
async function show(k) {
  [...$("tabs").children].forEach((b) => b.classList.toggle("on", b.dataset.k === k)); document.querySelector(".main").classList.toggle("full", k === "graph"); const cur = TABS.find((x) => x[0] === k); if (cur) $("vtitle").textContent = cur[1];
  const v = $("view"); v.replaceChildren(el("div", "small", "Loading...")); location.hash = k;
  const fresh = el("div");
  try { await VIEWS[k](fresh); } catch (e) { fresh.replaceChildren(el("div", "small", "Could not load: " + e.message)); }
  v.replaceChildren(fresh);
}
TABS.forEach(([k, t]) => { const b = el("button", "", t); b.dataset.k = k; b.onclick = () => show(k); $("tabs").append(b); });
show(TABS.some(([k]) => "#" + k === location.hash) ? location.hash.slice(1) : "overview");
