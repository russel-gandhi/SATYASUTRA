<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trust Report</title>
<link rel="stylesheet" href="/static/jv.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", "Noto Sans Kannada", sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .12em; } h2 { margin: 26px 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; justify-content: space-between; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  button, a.btn { background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
  .verdict { font-size: 30px; font-weight: 800; line-height: 1.1; } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .idle { color: var(--idle); }
  .q { font-size: 17px; margin: 6px 0; } .small { font-size: 13px; color: var(--mute); } .chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; margin: 2px 4px 2px 0; color: var(--mute); text-decoration: none; }
  ul { margin: 6px 0; padding-left: 20px; } li { margin: 4px 0; } a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; } th { color: var(--mute); font-weight: 600; }
  .t1, .t2 { color: var(--ok); } .t3, .t4 { color: var(--idle); }
  .warnbox { border: 1px solid var(--warn); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
  svg text { font: 12px system-ui, "Segoe UI", "Noto Sans Devanagari", sans-serif; fill: var(--text); } svg .legend text { fill: var(--mute); }
  .graphbox { overflow-x: auto; } img.thumb { max-width: 220px; border-radius: 8px; border: 1px solid var(--line); }
  @media print { .bar, .noprint { display: none !important; } body { background: #fff; color: #000; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="title">TRUST REPORT</h1><div class="small" id="when"></div></div>
  <div class="bar noprint">
    <button id="copy">Copy link</button><button id="print">Save as PDF / print</button><a class="btn" id="json" target="_blank">Download JSON</a>
    <button id="lang">हिन्दी में देखें</button><a class="btn" href="/">Back to the checker</a>
  </div>
  <div id="root"><div class="small">Loading...</div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const rid = location.pathname.split("/").pop();
const L = {
  en: { title: "TRUST REPORT", s1: "1. What was submitted", s2: "2. Language and entities", s3: "3. Media forensic findings", s4: "4. Supporting evidence", s5: "5. Contradicting evidence", s6: "6. Sources and their credibility",
        s7: "7. Contextual inconsistencies", s8: "8. Evidence graph", s9: "9. Verdict", s10: "10. Confidence and limitations", none: "None found.", noclaim: "No text claim was submitted, so there is no language or entity analysis.", nosup: "Nothing here supports the file being genuine. A detector finding nothing is not evidence that a file is real.", nocon: "No sign of manipulation was found by the detectors in section 3 or in our debunked-image index. This does not prove the file is genuine.", nosrc: "No outside source was involved. The findings come from the detectors in section 3 and from our index of images that fact-checkers have already examined.", below: "Below the cut:", above: "At or above the cut:", nf: "not found", fd: "found", under: "under the cut", noindex: "Debunked-image index: no match among the images fact-checkers have examined.", weak: "These are weak signals: a detector finding nothing does not prove the file is genuine.", matched: "Same image as one fact-checked by", tools: [["TruFor", "trained image-forgery detector (GRIP-UNINA, University of Naples Federico II); finds spliced or edited regions, not AI-generated images."], ["Smaug", "AI-generated-image detector (Abacus.AI); can miss new generators."], ["Debunked-image index", "perceptual hashes of images in fact-checkers' published articles; a match means the image was fact-checked before, not that it is false."], ["File metadata", "the camera and software fields, date and GPS stored in the file; can be edited."]], norel: "No relationships were found for this submission, so the graph has only the submitted file.", conf: "confidence", why: "How the verdict was reached",
        legend: { supports: "supports", contradicts: "contradicts", context: "context only", mentions: "mentions", same_image_as: "same image", spreading_as: "spreading as", related_not_used: "related, not used", records: "records", submitted_with: "submitted with" },
        published: "Generated", ledger: "Tamper-evident ledger entry", nonclaim: "no context problems found", orig: "Original wording", lang: "हिन्दी में देखें" },
  hi: { title: "भरोसा रिपोर्ट", s1: "1. क्या जमा किया गया", s2: "2. भाषा और नाम", s3: "3. मीडिया की फ़ॉरेंसिक जाँच", s4: "4. समर्थन में सबूत", s5: "5. विरोध में सबूत", s6: "6. स्रोत और उनकी विश्वसनीयता",
        s7: "7. संदर्भ में गड़बड़ियाँ", s8: "8. सबूतों का ग्राफ़", s9: "9. फ़ैसला", s10: "10. भरोसा और सीमाएँ", none: "कुछ नहीं मिला।", noclaim: "कोई लिखित दावा जमा नहीं हुआ, इसलिए भाषा या नामों का विश्लेषण नहीं है।", nosup: "यहाँ ऐसा कुछ नहीं है जो फ़ाइल के असली होने का समर्थन करे। जाँच में कुछ न मिलना असली होने का सबूत नहीं है।", nocon: "सेक्शन 3 के डिटेक्टरों या हमारे खंडन-की-गई-तस्वीरों के सूचकांक में छेड़छाड़ का कोई संकेत नहीं मिला। इसका मतलब यह नहीं कि फ़ाइल असली है।", nosrc: "कोई बाहरी स्रोत शामिल नहीं था। नतीजे सेक्शन 3 के डिटेक्टरों और उन तस्वीरों के हमारे सूचकांक से आए हैं जिन्हें फ़ैक्ट-चेकर पहले जाँच चुके हैं।", below: "कट से नीचे:", above: "कट के बराबर या ऊपर:", nf: "नहीं मिला", fd: "मिला", under: "कट से नीचे", noindex: "खंडन-तस्वीर सूचकांक: फ़ैक्ट-चेकरों की जाँची तस्वीरों में कोई मेल नहीं।", weak: "ये कमज़ोर संकेत हैं: डिटेक्टर को कुछ न मिलना फ़ाइल के असली होने का सबूत नहीं।", matched: "वही तस्वीर, जिसे जाँचा गया:", tools: [["TruFor", "इमेज-फ़ोर्जरी डिटेक्टर (GRIP-UNINA, नेपल्स विश्वविद्यालय); जोड़ी या एडिट की गई जगह पकड़ता है, AI से बनी तस्वीरें नहीं।"], ["Smaug", "AI से बनी तस्वीरों का डिटेक्टर (Abacus.AI); नए जनरेटर चूक सकता है।"], ["खंडन-तस्वीर सूचकांक", "फ़ैक्ट-चेकरों के लेखों की तस्वीरों के हैश; मेल का मतलब है कि तस्वीर पहले जाँची गई, ग़लत नहीं।"], ["फ़ाइल मेटाडेटा", "फ़ाइल में दर्ज कैमरा/सॉफ़्टवेयर, तारीख़ और GPS; बदला जा सकता है।"]], norel: "इस जमा के लिए कोई संबंध नहीं मिला, इसलिए ग्राफ़ में सिर्फ़ जमा की गई फ़ाइल है।", conf: "भरोसा", why: "फ़ैसला कैसे हुआ",
        legend: { supports: "समर्थन", contradicts: "विरोध", context: "सिर्फ़ संदर्भ", mentions: "ज़िक्र", same_image_as: "वही तस्वीर", spreading_as: "इस रूप में फैल रहा", related_not_used: "संबंधित, उपयोग नहीं", records: "दर्ज", submitted_with: "साथ जमा" },
        published: "बनाई गई", ledger: "छेड़छाड़-रोधी लेजर प्रविष्टि", nonclaim: "संदर्भ में कोई समस्या नहीं मिली", orig: "मूल शब्द", lang: "View in English" },
};
const MEDIA_NAME = { en: { AUTHENTIC_IN_CONTEXT: "NO PROBLEM FOUND", OUT_OF_CONTEXT: "OUT OF CONTEXT", EDITED: "EDITED", SYNTHETIC: "AI-GENERATED", SYNTHETIC_SUSPECTED: "POSSIBLY AI-GENERATED", INCONCLUSIVE: "INCONCLUSIVE: no sign of editing or AI found, not proof it is genuine" }, hi: { AUTHENTIC_IN_CONTEXT: "कोई समस्या नहीं मिली", OUT_OF_CONTEXT: "संदर्भ से बाहर", EDITED: "एडिट की गई", SYNTHETIC: "AI से बनी", SYNTHETIC_SUSPECTED: "शायद AI से बनी", INCONCLUSIVE: "अनिर्णायक: एडिट या AI का संकेत नहीं मिला, असली होने का सबूत नहीं" } };
const MEDIA_TONE = { EDITED: "bad", SYNTHETIC: "bad", SYNTHETIC_SUSPECTED: "warn", OUT_OF_CONTEXT: "warn", AUTHENTIC_IN_CONTEXT: "ok" };
const TONE = { SUPPORTED: "ok", REFUTED: "bad", MISSING_CONTEXT: "warn", UNVERIFIABLE_YET: "idle", NOT_A_CLAIM: "idle" };
const BAND = { high: { en: "high", hi: "उच्च" }, medium: { en: "medium", hi: "मध्यम" }, low: { en: "low", hi: "कम" } };
const EDGE_COLOR = { supports: "#3ecf8e", contradicts: "#ff6b6b", context: "#8b95ab", mentions: "#8b95ab", same_image_as: "#f5b84b", spreading_as: "#b07aff", related_not_used: "#8b95ab", records: "#8b95ab", submitted_with: "#7aa2ff" };
const NODE_COLOR = { claim: "#7aa2ff", entity: "#8b95ab", factcheck: "#3ecf8e", news: "#3ecf8e", official: "#3ecf8e", media: "#f5b84b", cluster: "#b07aff", registry: "#8b95ab", source: "#8b95ab", provenance: "#f5b84b" };

function wrapText(s, n) { const out = []; let line = ""; s.split(" ").forEach((w) => { if ((line + " " + w).trim().length > n && line) { out.push(line); line = w; } else line = (line + " " + w).trim(); }); if (line) out.push(line); return out.length > 4 ? [...out.slice(0, 3), out[3].replace(/.{0,3}$/, "...")] : out; }

function drawGraph(g, t) {
  const claims = g.nodes.filter((n) => n.kind === "claim"), media = g.nodes.filter((n) => ["media", "cluster"].includes(n.kind));
  const nw = 250, nh = 66, gap = 14, W = media.length ? 1000 : 700, colX = media.length ? { left: 20, mid: 375, right: 730 } : { left: 0, mid: 20, right: 430 };
  const rel = (id) => g.edges.find((e) => e.to === id || e.from === id);
  const sources = g.nodes.filter((n) => ["factcheck", "news", "official", "source", "provenance"].includes(n.kind) && !(media.length && g.edges.some((e) => e.from !== undefined && e.relation === "same_image_as" && e.to === n.id && false)));
  const entities = g.nodes.filter((n) => ["entity", "registry"].includes(n.kind));
  const order = { supports: 0, contradicts: 1, context: 2, related_not_used: 3 };
  const rank = (n) => { const e = g.edges.find((x) => x.from === n.id && x.to.startsWith("claim:")); return e ? (order[e.relation] ?? 4) : 5; };

  place(media, colX.left, 20); place(claims, colX.mid, 20 + Math.max(0, (Math.max(sources.length, 1) * (nh + gap) - claims.length * (nh + gap)) / 2));
  place(sources, colX.right, 20);
  const bottom = 20 + Math.max(sources.length, media.length, claims.length) * (nh + gap) + 30;
  entities.forEach((n, i) => { pos[n.id] = { x: 20 + (i % 3) * 270, y: bottom + Math.floor(i / 3) * (nh + gap) }; });
  const H = bottom + Math.ceil(entities.length / 3) * (nh + gap) + 60;
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");

    const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
    const x1 = a.x + nw, y1 = a.y + nh / 2, x2 = b.x, y2 = b.y + nh / 2;
    const leftward = a.x > b.x, sx = leftward ? a.x : x1, tx = leftward ? b.x + nw : x2;
    const mid = (sx + tx) / 2, p = mk("path", { d: `M${sx},${y1} C${mid},${y1} ${mid},${y2} ${tx},${y2}`, fill: "none", stroke: EDGE_COLOR[e.relation] || "#8b95ab", "stroke-width": e.relation === "supports" || e.relation === "contradicts" ? 2.2 : 1.2, "stroke-dasharray": ["context", "related_not_used", "mentions"].includes(e.relation) ? "4 3" : "" });
    p.append(mk("title", {}, `${t.legend[e.relation] || e.relation}${e.rating ? ": " + e.rating : ""}`)); svg.append(p);
  });
  g.nodes.forEach((n) => {
    const p = pos[n.id]; if (!p) return;
    const grp = mk("g", {}); if (n.url) { grp.style.cursor = "pointer"; grp.addEventListener("click", () => window.open(n.url, "_blank", "noopener")); }
    grp.append(mk("rect", { x: p.x, y: p.y, width: nw, height: nh, rx: 8, fill: "none", stroke: NODE_COLOR[n.kind] || "#8b95ab", "stroke-width": n.kind === "claim" ? 2.4 : 1.4 }));

function evidenceList(items, t) {
  if (!items.length) return el("div", "small", t.none);
  const ul = el("ul");
  items.forEach((x) => { const li = el("li"); const a = el("a", "", x.publisher || "source"); a.href = x.url; a.target = "_blank"; a.rel = "noopener"; li.append(a, ": " + (x.reviewed_claim ? "“" + x.reviewed_claim + "”" : x.rating || "") + (x.reviewed_at ? " (" + x.reviewed_at.slice(0, 10) + ")" : "")); ul.append(li); });
  return ul;
}

function mediaEvidence(sup, con, media, t) {
  media.forEach((m) => {
    const sigs = ((m.explanation && m.explanation.signals) || []).filter((x) => typeof x.score === "number"), fmt = (x) => x.signal + ": score " + x.score.toFixed(2) + ", cut " + x.cut + ". ";
    const ok = sigs.filter((x) => !x.over_cut), hit = sigs.filter((x) => x.over_cut);
    if (!sigs.length) { sup.append(el("div", "small", t.nosup)); if (!m.matches.length && !(m.reasons || []).length) con.append(el("div", "small", t.nocon)); (m.reasons || []).forEach((x) => con.append(el("div", "small", x))); return; }
    const ul = el("ul"); ok.forEach((x) => ul.append(el("li", "", fmt(x) + t.below + " " + x.meaning + " " + t.nf + " (" + Math.abs(x.margin).toFixed(2) + " " + t.under + ")."))); if (!m.matches.length) ul.append(el("li", "", t.noindex)); sup.append(ul, el("div", "small", t.weak));
    const cl = el("ul"); hit.forEach((x) => cl.append(el("li", "", fmt(x) + t.above + " " + x.meaning + " " + t.fd + "."))); m.matches.forEach((x) => { const li = el("li"), a = el("a", "", x.publisher + ": " + x.title); a.href = x.article_url; a.target = "_blank"; li.append(t.matched + " ", a); cl.append(li); });
    if (cl.children.length) con.append(cl); else con.append(el("div", "small", t.nocon));
  });
}

function render(r) {
  const t = L[r.lang] || L.en; document.documentElement.lang = r.lang; $("title").textContent = t.title; $("lang").textContent = t.lang;
  $("when").textContent = t.published + " " + r.generated_at.slice(0, 16).replace("T", " ") + " UTC · " + rid; $("json").href = "/report/" + rid + ".json";
  const root = $("root"); root.replaceChildren();
  const sec = r.sections, add = (h, ...nodes) => { root.append(el("h2", "", h)); const c = el("div", "card"); nodes.forEach((n) => c.append(n)); root.append(c); return c; };
  // verdict first, in plain words
  sec.claims.forEach((c) => {
    const c0 = el("div", "card"); c0.append(el("div", "verdict " + (TONE[c.verdict] || "idle"), c.verdict_name), el("div", "q", "“" + c.text + "”"), el("div", "small", t.conf + ": " + (BAND[c.confidence] || {})[r.lang]));
    root.append(c0);
  });
  sec.media.forEach((m) => { const c0 = el("div", "card"); c0.append(el("div", "verdict " + (MEDIA_TONE[m.label] || "idle"), (MEDIA_NAME[r.lang] || MEDIA_NAME.en)[m.label] || (m.label || "").replaceAll("_", " ")), el("div", "q", m.kind)); root.append(c0); });
  const s1 = add(t.s1); sec.submitted.forEach((s) => { const d = el("div", "q"); if (s.thumb) { const i = el("img", "thumb"); i.src = "data:image/jpeg;base64," + s.thumb; d.append(i, el("div", "small", s.name || s.kind)); } else d.textContent = (s.text || s.name || s.kind); s1.append(d); });
  const s2 = add(t.s2); if (!sec.claims.length) s2.append(el("div", "small", t.noclaim)); sec.claims.forEach((c) => { s2.append(el("div", "small", (c.language || "?").toUpperCase() + (c.translated ? " → EN" : "") + (c.original && c.original !== c.text ? " · " + t.orig + ": " + c.original : ""))); c.entities.forEach((e) => { const a = el("a", "chip", e.label + (e.description ? " – " + e.description : "")); a.href = e.url; a.target = "_blank"; s2.append(a); }); });
  const s3 = add(t.s3); if (!sec.media.length) s3.append(el("div", "small", t.none)); sec.media.forEach((m) => {
    if (m.thumb) { const i = el("img", "thumb"); i.src = "data:image/jpeg;base64," + m.thumb; s3.append(i); }
    s3.append(el("div", "q", (m.kind || "") + ": " + (m.label || "").replaceAll("_", " "))); const ul = el("ul"); (m.reasons || []).forEach((x) => ul.append(el("li", "", x))); s3.append(ul);
    (m.metadata || []).forEach((x) => s3.append(el("div", "small", x.text))); m.matches.forEach((x) => { const a = el("a", "", x.publisher + ": " + x.title); a.href = x.article_url; a.target = "_blank"; s3.append(a, el("br")); });
  });
  const sup = add(t.s4), con = add(t.s5); sec.claims.forEach((c) => { sup.append(evidenceList(c.supporting, t)); con.append(evidenceList(c.contradicting, t)); });
  if (!sec.claims.length) mediaEvidence(sup, con, sec.media, t);
  const s6 = add(t.s6); const tb = el("table"); tb.innerHTML = ""; const th = el("tr"); ["", "", "", ""].forEach(() => th.append(el("th")));
